name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Project checks
        run: python tools/check_project.py

      - name: Private research must never be tracked
        shell: bash
        run: |
          tracked="$(git ls-files research_private steam_text_dump)"
          if [ -n "$tracked" ]; then
            echo "::error::Private/extracted research material is tracked:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Canonical public identity
        shell: bash
        run: |
          old_first='Cunyi'
          old_last='Kang'
          old_lower='cunyi'
          canonical_first='Cochrane'
          pattern="${old_first} ${old_last}|${old_first}${old_last}|${old_lower}$(printf '%s' "$old_last" | tr '[:upper:]' '[:lower:]')|${canonical_first} ${old_last}|${canonical_first}${old_last}"
          if git grep -n -I -E "$pattern" -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp'; then
            echo "::error::Legacy repository-facing identity found"
            exit 1
          fi
